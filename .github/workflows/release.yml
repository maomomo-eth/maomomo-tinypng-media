name: 发布 WordPress 插件

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: worker-go/go.mod
          cache-dependency-path: worker-go/go.mod

      - name: 校验版本号
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(sed -n 's/^ \* Version: //p' maomomo-tinypng-media.php | head -n 1)"
          stable_tag="$(sed -n 's/^Stable tag: //p' readme.txt | head -n 1)"
          worker_version="$(sed -n 's/^const workerVersion = "\([^"]*\)"/\1/p' worker-go/types.go | head -n 1)"

          if [[ -z "${release_version}" || "${plugin_version}" != "${release_version}" || "${stable_tag}" != "${release_version}" || "${worker_version}" != "${release_version}" ]]; then
            echo "Tag、插件 Version、readme Stable tag 和 Go Worker 版本必须一致。" >&2
            echo "Tag=${release_version}, Version=${plugin_version}, Stable tag=${stable_tag}, Worker=${worker_version}" >&2
            exit 1
          fi

      - name: 测试 Go Worker
        working-directory: worker-go
        run: go test ./...

      - name: 编译 Go Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -C worker-go -buildvcs=false -trimpath -ldflags="-s -w" \
              -o "../dist/maomomo-tinypng-worker-linux-${arch}" .
          done

      - name: 打包插件
        shell: bash
        run: |
          set -euo pipefail
          package_dir="package/maomomo-tinypng-media"
          mkdir -p "${package_dir}/bin" "${package_dir}/worker"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='package/' \
            --exclude='worker-go/' \
            ./ "${package_dir}/"
          cp dist/maomomo-tinypng-worker-linux-* "${package_dir}/bin/"
          cp worker-go/maomomo-tinypng-worker.service "${package_dir}/worker/"
          cp worker-go/maomomo-tinypng-worker.env.example "${package_dir}/worker/"
          cp worker-go/README.md "${package_dir}/worker/README.md"
          chmod 0755 "${package_dir}"/bin/maomomo-tinypng-worker-linux-*
          (cd package && zip -qr ../dist/maomomo-tinypng-media.zip maomomo-tinypng-media)
          cd dist
          sha256sum \
            maomomo-tinypng-media.zip \
            maomomo-tinypng-worker-linux-amd64 \
            maomomo-tinypng-worker-linux-arm64 \
            > SHA256SUMS
          awk '$2 == "maomomo-tinypng-media.zip" { print }' SHA256SUMS > maomomo-tinypng-media.zip.sha256

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/maomomo-tinypng-media.zip \
            dist/maomomo-tinypng-media.zip.sha256 \
            dist/maomomo-tinypng-worker-linux-amd64 \
            dist/maomomo-tinypng-worker-linux-arm64 \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "MaoMoMo TinyPNG Media ${GITHUB_REF_NAME}"
